# docker-compose.test.yml
#
# Isolated database stack for the Mnemosyne eval project. Distinct
# container names, ports, and volumes from the production
# docker-compose.yml, so this can run on the SAME machine, at the SAME
# time, as your live deployment without any collision or risk of your
# 10 test personas writing into production Mongo/Qdrant.
#
# Run from the repo root (or wherever you keep this file):
#   docker compose -f docker-compose.test.yml up -d
#
# Point MnemosyneConfig at these ports (note the +1/offset pattern below):
#   mongo_url  = "mongodb://agent:agent@localhost:27018/memories?authSource=admin"
#   qdrant_url = "http://localhost:6334"

services:

  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: mnemosyne_pgvector_test
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: memories
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d memories"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-test:
    image: mongo:7
    container_name: mnemosyne_mongo_test
    environment:
      MONGO_INITDB_ROOT_USERNAME: agent
      MONGO_INITDB_ROOT_PASSWORD: agent
      MONGO_INITDB_DATABASE: memories
    ports:
      - "27018:27017"
    volumes:
      - mongo_test_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant-test:
    image: qdrant/qdrant:v1.12.0
    container_name: mnemosyne_qdrant_test
    ports:
      - "6334:6333"
    volumes:
      - qdrant_test_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-test:
    image: redis:7-alpine
    container_name: mnemosyne_redis_test
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  postgres_test_data:
  mongo_test_data:
  qdrant_test_data:

# NOTE: no `api` or `frontend` service here on purpose. The eval project
# talks to memory_engine.client.MnemosyneClient directly (in-process),
# not over HTTP -- so there's no FastAPI/Streamlit container to run for
# testing. This also means Qwen API calls still go out to Alibaba Cloud
# Model Studio for every persona turn (llm_client.py is unchanged), so
# expect real API usage/cost proportional to however many turns x
# personas x sessions you run.